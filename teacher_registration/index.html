<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right,#e7dfdf, #4f8fe4);
        }

       .container {
            width: 300px;
            margin: auto;
            margin-top: 60px;
        }

        h2 {
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #1ea4f7;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
        }
        input[type="radio"] {
            width: auto;
            margin: 0;
        }
    </style>
</head>

<body>

<div class="container">
    <h2 style="color: rgba(24, 20, 20, 0.865);">Registration Form</h2>

    <form onsubmit="return validateForm()">

        <label for="tfname">first name :</label><br>
        <input type="text" id="name" required><br>

        <label for="tsname" >Surname :</label><br>
        <input type="text" id="tSurname" required><br>

        <label for="phone_number" > Phone number :</label><br>
        <input type="tel" id="phone_number" required><br>

        <label for="email" > Email :</label><br>
        <input type="email" id="email" placeholder=" enter email" required><br>

        <label>Gender :</label><br><br>
        <input type="radio" name="gender" value="male" required>
         Male &nbsp;&nbsp;
        <input type="radio" name="gender" value="female">
         Female
         <br><br>
        <button type="submit">Register</button>

    </form>
</div>

<script>
function validateForm() {
    let phone_number = document.getElementById("phone_number").value;

    alert("Form submitted successfully!");
    return true;
}
</script>

</body>
</html>
